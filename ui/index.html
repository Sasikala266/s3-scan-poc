<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S3 File Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input {
      padding: 8px;
      width: 400px;
    }
    button {
      padding: 8px 16px;
      margin-top: 10px;
    }
    pre {
      margin-top: 20px;
      padding: 10px;
      background-color: #f4f4f4;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h2>S3 Scan POC</h2>

  <label for="fileName">Enter file name:</label><br><br>
  <input
    id="fileName"
    type="text"
    placeholder="employee_data.csv"
  />

  <br><br>

  <button onclick="startScan()">Start Scan</button>

  <pre id="result"></pre>

  <script>
    async function startScan() {
      const fileName = document.getElementById("fileName").value;
      const resultBox = document.getElementById("result");

      if (!fileName) {
        resultBox.innerText = "Please enter a file name.";
        return;
      }

      resultBox.innerText = "Triggering scan...";

      try {
        const response = await fetch(
          "https://l6s0iyqbnb.execute-api.us-east-1.amazonaws.com/prod/scan",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              file_name: fileName
            })
          }
        );

        const text = await response.text();
        resultBox.innerText = text;

      } catch (error) {
        resultBox.innerText = "Error calling API: " + error;
      }
    }
  </script>

</body>
</html>
